<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found – Christin Gilbert</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #FAF3EF;
      --surface:   #EACDC2;
      --dark:      #1A1423;
      --headline:  #1A1423;
      --body:      #1A1423;
      --muted:     #1A1423;
      --faint:     #C9A89D;
      --accent:    #6E4658;
      --accent-h:  #523544;
      --serif:     'Playfair Display', Georgia, serif;
      --body-fnt:  'Hanken Grotesk', system-ui, sans-serif;
      --mono:      'Hanken Grotesk', system-ui, sans-serif;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--body);
      font-family: var(--body-fnt);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.1rem 3.5rem 1.1rem 4.5rem;
      background: rgba(250, 243, 239, 0.97);
      backdrop-filter: blur(12px);
    }
    .nav-name {
      font-family: var(--mono);
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--dark);
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a {
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--accent); }
    .not-found {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1.5rem 6rem;
    }
    .not-found-eyebrow {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
    }
    .not-found h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(2rem, 4.5vw, 3rem);
      color: var(--headline);
      margin-bottom: 1rem;
      max-width: 20ch;
    }
    .not-found p {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 42ch;
      line-height: 1.65;
      margin-bottom: 2.25rem;
    }
    .not-found-actions {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn-primary {
      display: inline-block;
      background: var(--accent);
      color: var(--bg);
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 0.9rem 1.9rem;
      border-radius: 999px;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: var(--accent-h); }
    .btn-quiet {
      display: inline-block;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 0.9rem 0;
    }
    .btn-quiet:hover { color: var(--accent-h); }
    @media (max-width: 640px) {
      nav { padding: 1rem 1.5rem; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-name" style="text-decoration:none;">Christin Gilbert</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="work.html">Case Studies</a></li>
    <li><a href="about.html">About</a></li>
  </ul>
</nav>

<div class="not-found">
  <span class="not-found-eyebrow">404</span>
  <h1>This page moved, or never existed.</h1>
  <p>Either way, it's not here anymore. The work you're looking for is probably one click away.</p>
  <div class="not-found-actions">
    <a href="work.html" class="btn-primary">See the case studies</a>
    <a href="index.html" class="btn-quiet">Back to home &rarr;</a>
  </div>
</div>

</body>
</html>
